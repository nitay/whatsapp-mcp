name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest tests/ -q

  bridge:
    name: Bridge build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Build only — these images cannot be exercised without a paired
      # WhatsApp account, so CI verifies they compile and nothing more.
      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-bridge
          push: false
          load: true
          tags: whatsapp-mcp/bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build MCP server image
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-mcp-server
          push: false
          load: true
          tags: whatsapp-mcp/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The cgo trap: go-sqlite3 built without cgo compiles fine and then
      # fails at the first query. Prove the shipped binary is a real driver.
      - name: Assert the bridge binary was built with cgo
        run: |
          docker run --rm --entrypoint sh whatsapp-mcp/bridge:ci -c \
            'ldd /usr/local/bin/whatsapp-bridge 2>&1 | grep -q libc || { echo "bridge binary is not linked against libc: built without cgo"; exit 1; }'
      - name: Assert the MCP server imports
        run: |
          docker run --rm --entrypoint uv whatsapp-mcp/server:ci \
            run --frozen --no-dev python -c 'import main, whatsapp; print("imports ok")'
